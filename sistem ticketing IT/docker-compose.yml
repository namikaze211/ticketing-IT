services:
  it-ticketing:
    build: .
    container_name: it_ticketing_system
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Data database tersimpan di host agar tidak hilang saat restart container
      - ./ticketing.db:/app/ticketing.db
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - THREADS=8
